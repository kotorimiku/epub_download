[package]
name = "bilinovel"
version = "0.1.0"
edition = "2024"
description = "Core request and parsing library for bilinovel"
authors = ["kotorimiku"]

[features]
specta = ["dep:specta"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

specta = { version = "2.0.0-rc", features = ["derive"], optional = true }

reqwest = { version = "0.13.2", features = [
  "gzip",
  "deflate",
  "brotli",
  "zstd",
  "json",
  "cookies",
] }
scraper = "0.26.0"
tokio = { version = "1.42.0", features = ["full"] }
regex = "1.11.1"
fast2s = "0.3.1"
image = "0.25.5"
url = "2.5.7"
color-eyre = "0.6.5"
